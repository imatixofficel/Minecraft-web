name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install
      - run: node scripts/downloadSoundsMap.mjs
      - run: pnpm build
        env:
          CONFIG_JSON_SOURCE: BUNDLED
      - name: Verify required files exist in dist
        run: |
          ls dist | head -50
          test -f dist/mesher.js || (echo "dist/mesher.js missing" && exit 1)
          ls dist/static/assets | grep -E "mc-worldgen-data.*\.zip" || (echo "worldgen zip missing" && exit 1)
      - run: touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
